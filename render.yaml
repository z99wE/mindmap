services:
  - type: web
    name: unzonko
    env: docker
    plan: free
    region: oregon
    branch: main
    rootDir: phase2-working
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: unzonko-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VITE_ENABLE_PAYMENTS
        value: "false"
      - key: ADMIN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: LIGHTNING_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_ENCRYPTION_SECRET
        generateValue: true
      # Email (Resend) — alternative provider/fallback
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER_EMAIL
        sync: false
      - key: RESEND_SENDER_NAME
        sync: false

databases:
  - name: unzonko-db
    databaseName: thought_gps
    user: thought_gps_user
    plan: free
    region: oregon
