services:
  - type: web
    name: thought-gps
    env: docker
    plan: free
    region: oregon
    branch: main
    rootDir: phase2-working
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VITE_ENABLE_PAYMENTS
        value: "false"
      - key: ADMIN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: LIGHTNING_API_KEY
        sync: false
