services:
  - name: rementally
    type: web
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: phase2-working
    dockerfilePath: phase2-working/Dockerfile
    dockerContext: phase2-working
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rementally-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VITE_ENABLE_PAYMENTS
        value: "false"
      - key: ADMIN_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREWORKS_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: LIGHTNING_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_ENCRYPTION_SECRET
        generateValue: true

      # Web Push (VAPID) — auto-generated if missing (push disabled until configured)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false

      # Registration gating — without these, NO ONE can register in production
      - key: ALLOWED_ADMIN_EMAILS
        sync: false
      - key: ALLOWED_BETA_EMAILS
        sync: false

      # Email (Resend) — alternative provider/fallback
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER_EMAIL
        sync: false
      - key: RESEND_SENDER_NAME
        value: ReMentally
      - key: RESEND_SENDER_EMAIL
        value: noreply@rementally.onrender.com

      # PulseKit — Native Multi-Channel Messaging
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SIGNAL_REST_URL
        sync: false
      - key: SIGNAL_PHONE_NUMBER
        sync: false
      - key: SIGNAL_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

databases:
  - name: rementally-db
    databaseName: rementally
    user: rementally_user
    plan: free
    region: oregon
