services:
  - type: web
    name: thought-gps
    env: docker
    plan: free
    region: oregon
    branch: main
    rootDir: phase2-working
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VITE_ENABLE_PAYMENTS
        value: "false"
