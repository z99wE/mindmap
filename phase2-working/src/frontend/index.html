<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought GPS — Cognitive Coprocessor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'serif'],
            body: ['"Barlow"', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: '9999px',
          }
        }
      }
    }
  </script>

  <style>
    @import url('./src/styles/m3-tokens.css');
    @import url('./src/styles/glass.css');
    @import url('./src/styles/animations.css');

    .liquid-glass {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.45) 0%,
        rgba(255,255,255,0.15) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.15) 80%,
        rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .liquid-glass-strong {
      background: rgba(255,255,255,0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(50px);
      -webkit-backdrop-filter: blur(50px);
      border: none;
      box-shadow: 4px 4px 4px rgba(0,0,0,0.05), inset 0 1px 1px rgba(255,255,255,0.15);
      position: relative;
      overflow: hidden;
    }
    .liquid-glass-strong::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg,
        rgba(255,255,255,0.5) 0%,
        rgba(255,255,255,0.2) 20%,
        rgba(255,255,255,0) 40%,
        rgba(255,255,255,0) 60%,
        rgba(255,255,255,0.2) 80%,
        rgba(255,255,255,0.5) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .neon-cyan {
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0,243,255,0.5);
    }
    .neon-pink {
      color: #ff0055;
      text-shadow: 0 0 8px rgba(255,0,85,0.5);
    }
    .neon-green {
      color: #39ff14;
      text-shadow: 0 0 8px rgba(57,255,20,0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      background: #000000;
      color: #ebebeb;
      overflow-x: hidden;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Grid Pattern Background ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.4;
      mask-image: radial-gradient(circle at center, black 20%, transparent 100%);
    }

    /* ── Noise Overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
      opacity: 0.08;
    }

    #app-root { position: relative; z-index: 1; min-height: 100vh; }

    /* ── App Shell ── */
    .app-shell { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
    @media (max-width: 840px) { .app-shell { grid-template-columns: 1fr; } }

    /* ── Navigation Rail (Desktop) ── */
    .nav-rail {
      grid-row: 1 / -1;
      background: rgba(12, 12, 12, 0.95);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
    }
    @media (max-width: 840px) { .nav-rail { display: none; } }

    .nav-logo {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem;
      margin-bottom: 1rem;
    }
    .nav-logo-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: #ccff00;
      display: grid; place-items: center;
      box-shadow: 0 0 20px rgba(204, 255, 0, 0.3);
      font: 700 20px/1 'Space Grotesk', sans-serif;
      color: #000000;
    }
    .nav-logo-text { font: 600 16px/1.2 'Space Grotesk', sans-serif; color: #ebebeb; letter-spacing: -0.04em; }
    .nav-logo-sub { font: 500 11px/1.2 'JetBrains Mono', monospace; color: rgba(235,235,235,0.4); text-transform: uppercase; letter-spacing: 0.15em; }

    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      font: 500 14px/20px 'Space Grotesk', sans-serif;
      color: rgba(235,235,235,0.6);
      cursor: pointer;
      transition: all 200ms ease;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.05); color: #ebebeb; }
    .nav-item.active {
      background: rgba(204, 255, 0, 0.12);
      color: #d4ff33;
    }
    .nav-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    .nav-item.active .nav-dot { background: #ccff00; box-shadow: 0 0 8px rgba(204,255,0,0.5); }
    .nav-section-label {
      font: 500 10px/16px 'JetBrains Mono', monospace;
      color: rgba(235,235,235,0.25);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 1rem 1rem 0.25rem;
    }

    /* ── Bottom Nav (Mobile) ── */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(12, 12, 12, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 100;
      padding: 0.5rem 0 env(safe-area-inset-bottom, 0.5rem);
    }
    .bottom-nav-items { display: flex; justify-content: space-around; }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 0.5rem;
      color: rgba(235,235,235,0.5);
      font: 500 11px/1.2 'Space Grotesk', sans-serif;
      cursor: pointer;
    }
    .bottom-nav-item.active { color: #ccff00; }
    .bottom-nav-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.4;
    }
    .bottom-nav-item.active .bottom-nav-dot { opacity: 1; box-shadow: 0 0 6px rgba(204,255,0,0.5); }
    @media (max-width: 840px) { .bottom-nav { display: block; } main { padding-bottom: 80px; } }

    /* ── Top Bar ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: rgba(10, 10, 10, 0.8);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: sticky; top: 0; z-index: 5;
    }
    .top-bar-title { font: 600 18px/24px 'Space Grotesk', sans-serif; letter-spacing: -0.04em; }
    .top-bar-actions { display: flex; align-items: center; gap: 0.75rem; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: transparent; border: none;
      color: rgba(235,235,235,0.6);
      cursor: pointer;
      position: relative;
      transition: background 150ms ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,.08); }
    .badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font: 600 10px/16px 'Space Grotesk';
      display: grid; place-items: center;
      padding: 0 4px;
    }
    .user-chip {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: border-color 200ms;
    }
    .user-chip:hover { border-color: rgba(204, 255, 0, 0.4); }

    /* ── Main Content ── */
    main {
      padding: 1.5rem;
      max-width: 1400px;
      width: 100%;
    }
    @media (max-width: 840px) { main { padding: 1rem; } }

    /* ── Mobile Menu Button ── */
    .mobile-menu-btn { display: none; }
    @media (max-width: 840px) { .mobile-menu-btn { display: grid; } }

    /* ── Mobile Drawer ── */
    .mobile-drawer {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none;
      transition: opacity 300ms ease;
    }
    .mobile-drawer.open { opacity: 1; pointer-events: auto; }
    .mobile-drawer-content {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 300px; max-width: 85vw;
      background: rgba(12, 12, 12, 0.98);
      backdrop-filter: blur(16px);
      padding: 1rem;
      transform: translateX(-100%);
      transition: transform 300ms cubic-bezier(0.05, 0.7, 0.1, 1);
      overflow-y: auto;
    }
    .mobile-drawer.open .mobile-drawer-content { transform: translateX(0); }

    /* ── UI Legibility & Glow Hover Overrides ── */
    .surface-card {
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease !important;
      color: #f5f5f7 !important;
    }
    .surface-card:hover {
      border-color: rgba(204, 255, 0, 0.4) !important;
      box-shadow: 0 8px 30px rgba(204, 255, 0, 0.15) !important;
      transform: translateY(-2px) !important;
    }
    p, .md-sys-color-outline, .md-sys-color-on-surface-variant {
      color: rgba(235, 235, 245, 0.8) !important;
    }
    input, textarea, select, option {
      color: #ffffff !important;
    }

    /* ── Chromium Text Vibes ── */
    .chromium-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-transform: uppercase;
      background: linear-gradient(180deg, #e0e0e0 0%, #a0a0a0 40%, #505050 50%, #d0d0d0 60%, #ffffff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      z-index: 2;
      pointer-events: none;
    }
    /* Hide scrollbars globally for a cleaner UI */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
  </style>
</head>
<body>
  <!-- Skip to content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Glow Spheres -->
  <div class="ambient-orb orb-primary"></div>
  <div class="ambient-orb orb-secondary"></div>
  <div class="ambient-orb orb-tertiary"></div>

  <div id="app-root">
    <div class="app-shell">
      <!-- Desktop Nav Rail -->
      <nav class="nav-rail" id="nav-rail" role="navigation" aria-label="Main navigation"></nav>

      <!-- Main area -->
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <!-- Top Bar -->
        <header class="top-bar" id="top-bar">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <button class="icon-btn mobile-menu-btn" onclick="toggleDrawer()" aria-label="Open menu">
              <span style="font:700 18px/1 'Space Grotesk';">&#9776;</span>
            </button>
            <span class="top-bar-title" id="page-title">Home</span>
          </div>
          <div class="top-bar-actions">
            <div class="status-tag" style="margin-right:0.5rem;">
              <span class="dot-pulse"></span>
              <span>SYSTEM ONLINE</span>
            </div>
            <button class="icon-btn" id="notif-btn" onclick="showPage('notifications')" aria-label="Notifications">
              <span class="mono-label" style="font-size:11px;color:inherit;">NOTIF</span>
              <span class="badge" id="notif-badge" style="display:none;">0</span>
            </button>
            <div class="user-chip" id="user-chip" onclick="handleUserClick()" role="button" aria-label="User account">
              <span style="font:600 14px/1 'Space Grotesk';color:rgba(235,235,235,0.6);">&#9679;</span>
              <span id="user-name" style="font:500 13px/1 'Space Grotesk',sans-serif;">Sign In</span>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" aria-live="polite"></main>
        <!-- Strands Ambient Footer -->
        <div id="strands-footer" style="height: 300px; position: relative; width: 100%; overflow: hidden; margin-top: auto; z-index: 0;">
          <div id="strands-react-root" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></div>
        </div>
      </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav" role="navigation" aria-label="Mobile navigation">
      <div class="bottom-nav-items" id="bottom-nav-items"></div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobile-drawer" onclick="closeDrawer(event)">
      <div class="mobile-drawer-content" id="drawer-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    // ── Service Worker Registration ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          console.log('[SW] Registered:', reg.scope);
          // Fetch VAPID public key and subscribe
          const res = await fetch('/api/notifications/vapid-public-key');
          if (res.ok) {
            const { publicKey } = await res.json();
            const sub = await reg.pushManager.getSubscription();
            if (!sub) {
              await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: publicKey,
              });
            }
          }
        } catch (e) { console.warn('[SW] Registration failed:', e); }
      });
    }
    function toggleDrawer() {
      document.getElementById('mobile-drawer').classList.toggle('open');
    }
    function closeDrawer(e) {
      if (e.target === e.currentTarget) {
        document.getElementById('mobile-drawer').classList.remove('open');
      }
    }
    window.toggleDrawer = toggleDrawer;
    window.closeDrawer = closeDrawer;

    // ── Scroll Reveal + Parallax Observer ──
    (function() {
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add('in-view'), i * 80);
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

      const mainObserver = new MutationObserver(() => {
        document.querySelectorAll('.scroll-reveal:not(.in-view)').forEach(el => {
          revealObserver.observe(el);
        });
        // Also observe card-reveal elements
        document.querySelectorAll('.card-reveal:not(.revealed)').forEach((el, i) => {
          setTimeout(() => el.classList.add('revealed'), i * 60);
        });
      });
      mainObserver.observe(document.getElementById('main-content') || document.body, {
        childList: true, subtree: true
      });

      // ── 3D Tilt for .glass-3d cards ──
      document.addEventListener('mousemove', (e) => {
        const cards = document.querySelectorAll('.glass-3d');
        cards.forEach(card => {
          const rect = card.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const deltaX = (e.clientX - centerX) / rect.width;
          const deltaY = (e.clientY - centerY) / rect.height;
          const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          if (dist < 2) {
            const rotateX = deltaY * -6;
            const rotateY = deltaX * 6;
            card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
          }
        });
      });

      // ── Parallax depth on scroll ──
      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        document.querySelectorAll('.parallax-section').forEach((section, i) => {
          const speed = 0.15 + (i * 0.05);
          section.style.transform = `translateY(${scrollY * speed}px)`;
        });
      }, { passive: true });
    })();
  </script>
</body>
</html>
