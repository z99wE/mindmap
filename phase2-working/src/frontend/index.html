<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought GPS — Cognitive Coprocessor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded" rel="stylesheet">
  <style>
    @import url('./src/styles/m3-tokens.css');
    @import url('./src/styles/glass.css');
    @import url('./src/styles/animations.css');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      overflow-x: hidden;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.3;
      mask-image: radial-gradient(circle at center, black 20%, transparent 100%);
    }
    a { color: inherit; text-decoration: none; }
    #app-root { position: relative; z-index: 1; min-height: 100vh; }

    /* ── App Shell ── */
    .app-shell { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
    @media (max-width: 840px) { .app-shell { grid-template-columns: 1fr; } }

    /* ── Navigation Rail (Desktop) ── */
    .nav-rail {
      grid-row: 1 / -1;
      background: var(--md-sys-color-surface-container);
      border-right: 1px solid var(--md-sys-color-outline-variant);
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 10;
    }
    @media (max-width: 840px) { .nav-rail { display: none; } }

    .nav-logo {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem;
      margin-bottom: 1rem;
    }
    .nav-logo-icon {
      width: 40px; height: 40px;
      border-radius: var(--md-sys-shape-medium);
      background: linear-gradient(135deg, var(--md-sys-color-primary-container), var(--md-sys-color-secondary-container));
      display: grid; place-items: center;
    }
    .nav-logo-text { font: var(--md-sys-typescale-title-small); color: var(--md-sys-color-on-surface); }
    .nav-logo-sub { font: var(--md-sys-typescale-label-small); color: var(--md-sys-color-on-surface-variant); }

    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--md-sys-shape-full);
      font: var(--md-sys-typescale-label-large);
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      transition: all 200ms ease;
      position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,.05); color: var(--md-sys-color-on-surface); }
    .nav-item.active {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }
    .nav-item .material-symbols-rounded { font-size: 22px; }
    .nav-section-label {
      font: var(--md-sys-typescale-label-small);
      color: var(--md-sys-color-outline);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 1rem 1rem 0.25rem;
    }

    /* ── Bottom Nav (Mobile) ── */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--md-sys-color-surface-container);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      z-index: 100;
      padding: 0.5rem 0 env(safe-area-inset-bottom, 0.5rem);
    }
    .bottom-nav-items { display: flex; justify-content: space-around; }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 0.5rem;
      color: var(--md-sys-color-on-surface-variant);
      font: var(--md-sys-typescale-label-small);
      cursor: pointer;
    }
    .bottom-nav-item.active { color: var(--md-sys-color-primary); }
    @media (max-width: 840px) { .bottom-nav { display: block; } main { padding-bottom: 80px; } }

    /* ── Top Bar ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--md-sys-color-surface);
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      position: sticky; top: 0; z-index: 5;
      backdrop-filter: blur(12px);
    }
    .top-bar-title { font: var(--md-sys-typescale-title-medium); }
    .top-bar-actions { display: flex; align-items: center; gap: 0.75rem; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: var(--md-sys-shape-full);
      display: grid; place-items: center;
      background: transparent; border: none;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
      position: relative;
      transition: background 150ms ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,.08); }
    .badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px;
      border-radius: var(--md-sys-shape-full);
      background: var(--md-sys-color-error);
      color: var(--md-sys-color-on-error);
      font: 600 10px/16px 'Inter';
      display: grid; place-items: center;
      padding: 0 4px;
    }
    .user-chip {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--md-sys-shape-full);
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      cursor: pointer;
    }
    .user-chip:hover { border-color: var(--md-sys-color-outline); }

    /* ── Main Content ── */
    main {
      padding: 1.5rem;
      max-width: 1400px;
      width: 100%;
    }
    @media (max-width: 840px) { main { padding: 1rem; } }

    /* ── Mobile Menu Button ── */
    .mobile-menu-btn { display: none; }
    @media (max-width: 840px) { .mobile-menu-btn { display: grid; } }

    /* ── Mobile Drawer ── */
    .mobile-drawer {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.5);
      opacity: 0; pointer-events: none;
      transition: opacity 300ms ease;
    }
    .mobile-drawer.open { opacity: 1; pointer-events: auto; }
    .mobile-drawer-content {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 300px; max-width: 85vw;
      background: var(--md-sys-color-surface-container);
      padding: 1rem;
      transform: translateX(-100%);
      transition: transform 300ms cubic-bezier(0.05, 0.7, 0.1, 1);
      overflow-y: auto;
    }
    .mobile-drawer.open .mobile-drawer-content { transform: translateX(0); }
  </style>
</head>
<body>
  <!-- Skip to content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Ambient orbs -->
  <div class="ambient-orb orb-primary"></div>
  <div class="ambient-orb orb-secondary"></div>
  <div class="ambient-orb orb-tertiary"></div>

  <div id="app-root">
    <div class="app-shell">
      <!-- Desktop Nav Rail -->
      <nav class="nav-rail" id="nav-rail" role="navigation" aria-label="Main navigation"></nav>

      <!-- Main area -->
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <!-- Top Bar -->
        <header class="top-bar" id="top-bar">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <button class="icon-btn mobile-menu-btn" onclick="toggleDrawer()" aria-label="Open menu">
              <span class="material-symbols-rounded">menu</span>
            </button>
            <span class="top-bar-title" id="page-title">Home</span>
          </div>
          <div class="top-bar-actions">
            <button class="icon-btn" id="notif-btn" onclick="showPage('notifications')" aria-label="Notifications">
              <span class="material-symbols-rounded">notifications</span>
              <span class="badge" id="notif-badge" style="display:none;">0</span>
            </button>
            <div class="user-chip" id="user-chip" onclick="handleUserClick()" role="button" aria-label="User account">
              <span class="material-symbols-rounded" style="font-size:18px;">person</span>
              <span id="user-name" style="font:var(--md-sys-typescale-label-medium);">Sign In</span>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" aria-live="polite"></main>
      </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav" role="navigation" aria-label="Mobile navigation">
      <div class="bottom-nav-items" id="bottom-nav-items"></div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobile-drawer" onclick="closeDrawer(event)">
      <div class="mobile-drawer-content" id="drawer-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    function toggleDrawer() {
      document.getElementById('mobile-drawer').classList.toggle('open');
    }
    function closeDrawer(e) {
      if (e.target === e.currentTarget) {
        document.getElementById('mobile-drawer').classList.remove('open');
      }
    }
    window.toggleDrawer = toggleDrawer;
    window.closeDrawer = closeDrawer;

    // ── Scroll Reveal + Parallax Observer ──
    (function() {
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add('in-view'), i * 80);
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

      // Observe new .scroll-reveal elements on each page load
      const mainObserver = new MutationObserver(() => {
        document.querySelectorAll('.scroll-reveal:not(.in-view)').forEach(el => {
          revealObserver.observe(el);
        });
      });
      mainObserver.observe(document.getElementById('main-content') || document.body, {
        childList: true, subtree: true
      });

      // ── 3D Tilt for .glass-3d cards ──
      document.addEventListener('mousemove', (e) => {
        const cards = document.querySelectorAll('.glass-3d');
        cards.forEach(card => {
          const rect = card.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const deltaX = (e.clientX - centerX) / rect.width;
          const deltaY = (e.clientY - centerY) / rect.height;
          const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
          if (dist < 2) {
            const rotateX = deltaY * -6;
            const rotateY = deltaX * 6;
            card.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
          }
        });
      });

      // ── Parallax depth on scroll ──
      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        document.querySelectorAll('.parallax-section').forEach((section, i) => {
          const speed = 0.15 + (i * 0.05);
          section.style.transform = `translateY(${scrollY * speed}px)`;
        });
      }, { passive: true });
    })();
  </script>
</body>
</html>
