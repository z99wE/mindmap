<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought GPS // Mission Control // 2100 AD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Courier+New:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0a0f1a;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    /* Scanline effect */
    .scanlines {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.3;
    }
    
    /* CRT glow effect */
    .crt {
      animation: flicker 0.15s infinite;
    }
    
    @keyframes flicker {
      0% { opacity: 0.97; }
      50% { opacity: 1; }
      100% { opacity: 0.98; }
    }
    
    /* Glitch text effect */
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    
    .glitch {
      animation: glitch 0.3s infinite;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    /* Header - Carbon Design Inspired */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, #1a1f2e 0%, #0a0f1a 100%);
      border: 2px solid #f08c29;
      border-radius: 8px;
      box-shadow: 0 0 30px #f08c2933;
      margin-bottom: 2rem;
    }
    
    .header h1 {
      font-family: 'Orbitron', sans-serif;
      color: #f08c29;
      text-shadow: 0 0 20px #f08c29;
      font-size: 2.5rem;
    }
    
    .status-badge {
      padding: 0.5rem 1rem;
      background: rgba(239, 231, 205, 0.15);
      border: 1px solid #f08c29;
      color: #f08c29;
      border-radius: 4px;
      font-family: 'Orbitron', sans-serif;
    }
    
    /* Navigation - Carbon Design */
    .nav {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .nav-btn {
      padding: 0.75rem 1.5rem;
      background: #1a1f2e;
      border: 1px solid #f08c29;
      color: #f08c29;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
    }
    
    .nav-btn:hover, .nav-btn.active {
      background: #f08c29;
      color: #0a0f1a;
      box-shadow: 0 0 20px #f08c2955;
    }
    
    /* Content cards - Carbon Design */
    .card {
      background: #1a1f2e;
      border: 1px solid #f08c2933;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 0 30px #f08c2911;
    }
    
    .card h2 {
      font-family: 'Orbitron', sans-serif;
      color: #f08c29;
      text-shadow: 0 0 10px #f08c29;
      margin-bottom: 2rem;
    }
    
    /* Buttons */
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .btn-primary {
      background: #f08c29;
      color: #0a0f1a;
      box-shadow: 0 0 20px #f08c2955;
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid #555;
      color: #fff;
    }
    
    .btn-accent {
      background: #f08c29;
      color: #0a0f1a;
      box-shadow: 0 0 20px #f08c2955;
    }
    
    .btn-success {
      background: #198038;
      color: #fff;
      box-shadow: 0 0 20px #19803855;
    }
    
    .btn:hover {
      transform: scale(1.02);
    }
    
    /* Form inputs */
    input, select {
      padding: 0.75rem;
      background: #0a0f1a;
      border: 2px solid #555;
      border-radius: 4px;
      color: #fff;
      font-family: 'Courier New', monospace;
      width: 100%;
      margin-bottom: 1rem;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #f08c29;
    }
    
    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }
    
    .stat-box {
      background: #0a0f1a;
      padding: 1.5rem;
      border-radius: 8px;
      text-align: center;
      border-left: 3px solid #f08c29;
    }
    
    .stat-value {
      font-size: 3rem;
      font-family: 'Courier New', monospace;
      color: #fff;
      font-weight: bold;
    }
    
    .stat-label {
      color: #888;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    
    /* API keys table */
    .keys-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    
    .keys-table th, .keys-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid #555;
    }
    
    .keys-table th {
      color: #f08c29;
      font-family: 'Orbitron', sans-serif;
    }
    
    .keys-table td {
      color: #aaa;
    }
    
    .key-service {
      color: #f08c29;
      font-weight: bold;
    }

    .key-value {
      font-family: 'Courier New', monospace;
      color: #198038;
    }

    /* Landing Pitch Layout CSS */
    .home-pitch-container {
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }
    
    .hero-section {
      position: relative;
      padding: 4rem 2rem;
      background: #111625;
      border: 1px solid #f08c2933;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .brand-eyebrow {
      font-family: 'Orbitron', sans-serif;
      color: #198038;
      font-weight: 700;
      letter-spacing: 0.25em;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    
    .hero-headline {
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      line-height: 1.1;
      color: #f08c29;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 15px rgba(240, 140, 41, 0.25);
    }
    
    .hero-subheadline {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      font-weight: normal;
      color: #ccc;
      max-width: 75ch;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    
    .hero-cta-group {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    
    .btn-lg {
      padding: 1rem 2rem;
      font-size: 1.1rem;
    }
    
    .telemetry-ticker {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-family: 'Courier New', monospace;
      color: #198038;
    }
    
    .telemetry-pulse {
      width: 10px;
      height: 10px;
      background: #198038;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }
    
    .value-prop-strip {
      background: #1a1f2e;
      border: 1px solid #555;
      padding: 1.5rem;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .marquee-wrapper {
      white-space: nowrap;
      overflow: hidden;
    }
    
    .marquee-content {
      display: inline-block;
      animation: marquee 30s linear infinite;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      color: #fff;
    }
    
    .marquee-content span {
      margin-right: 2rem;
    }
    
    .marquee-content .divider {
      color: #f08c29;
    }
    
    @keyframes marquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    
    .grid-2col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 3rem;
    }
    
    .section-label {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 0.15em;
      font-size: 0.8rem;
      margin-bottom: 1rem;
    }
    
    .text-warning { color: #f08c29; }
    .text-success { color: #198038; }
    .text-orange { color: #f08c29; }
    .text-green { color: #198038; }
    
    .section-heading {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    
    .section-body {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #bbb;
      margin-bottom: 2rem;
    }
    
    .problem-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .problem-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    
    .cross-icon {
      width: 18px;
      height: 18px;
      border: 2px solid #f08c29;
      position: relative;
      flex-shrink: 0;
      margin-top: 4px;
    }
    
    .cross-icon::after {
      content: "/";
      position: absolute;
      top: -2px;
      left: 3px;
      color: #f08c29;
      font-weight: bold;
    }
    
    .solution-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    .solution-card {
      background: #111625;
      border: 1px solid #555;
      padding: 1.5rem;
      border-radius: 8px;
    }
    
    .sol-num {
      font-family: 'Orbitron', sans-serif;
      color: #198038;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    .pipeline-step {
      background: #111625;
      border-top: 3px solid #f08c29;
      padding: 1.5rem;
      border-radius: 0 0 8px 8px;
    }
    
    .step-badge {
      font-family: 'Orbitron', sans-serif;
      color: #f08c29;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    
    .step-desc {
      font-size: 0.95rem;
      line-height: 1.4;
      color: #ccc;
    }
    
    .comparison-table-wrapper {
      border: 1px solid #555;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 2rem;
    }
    
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .comparison-table th, .comparison-table td {
      padding: 1.2rem;
      text-align: left;
    }
    
    .comparison-table th {
      background: #111625;
      font-family: 'Orbitron', sans-serif;
      border-bottom: 2px solid #555;
    }
    
    .comparison-table td {
      border-bottom: 1px solid #333;
      color: #aaa;
    }
    
    .accent-header {
      color: #f08c29;
      border-left: 2px solid #555;
    }
    
    .success-row {
      color: #fff;
      font-weight: bold;
      border-left: 2px solid #555;
    }
    
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    
    .benefit-item {
      background: #111625;
      border-left: 3px solid #198038;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
    }
    
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    
    .feat-card {
      background: #111625;
      border: 1px solid #333;
      padding: 2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .feat-card:hover {
      border-color: #f08c29;
      box-shadow: 0 0 20px rgba(240, 140, 41, 0.15);
      transform: translateY(-2px);
    }
    
    .feat-card h5 {
      font-family: 'Orbitron', sans-serif;
      color: #f08c29;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    
    .feat-card p {
      font-size: 0.95rem;
      color: #aaa;
      line-height: 1.5;
    }
    
    .brand-footer-pitch {
      text-align: center;
      padding: 4rem 2rem;
      background: #111625;
      border: 1px solid #555;
      border-radius: 12px;
      margin-top: 2rem;
    }
    
    .tagline {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      line-height: 1.2;
    }
    
    /* Footer */
    .footer {
      margin-top: 3rem;
      padding: 2rem;
      text-align: center;
      color: #888;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  
  <div class="container">
    <header class="header">
      <h1>THOUGHT GPS</h1>
      <div class="status-badge">MISSION CONTROL // V1.2.2 // 2100 AD</div>
    </header>
    
    <nav class="nav" role="navigation" aria-label="Main Menu">
      <button class="nav-btn active" onclick="showPage('home')" aria-label="Navigate to Home Page">HOME</button>
      <button class="nav-btn" onclick="showPage('dashboard')" aria-label="View System Dashboard">DASHBOARD</button>
      <button class="nav-btn" onclick="showPage('mission-control')" aria-label="Access Mission Control Details">MISSION CONTROL</button>
      <button class="nav-btn" onclick="showPage('brain-fragments')" aria-label="Analyze Brain Fragments and thinking lobes">BRAIN FRAGMENTS</button>
      <button class="nav-btn" onclick="showPage('cognitive-load')" aria-label="Inspect Seesaw Cognitive Load Level">COGNITIVE LOAD</button>
      <button class="nav-btn" onclick="showPage('api-keys')" aria-label="Configure third party API Keys">API KEYS</button>
      <button class="nav-btn" onclick="showPage('credits')" aria-label="Manage Account Tier Credits">CREDITS</button>
      <button class="nav-btn" onclick="showPage('memory')" aria-label="Open Memory Archive and Export Settings">MEMORY</button>
      <button class="nav-btn" onclick="showPage('legal')" aria-label="Read legal notice and AI hallucinations disclaimers">DISCLAIMERS</button>
    </nav>
    
    <main id="main-content"></main>
    
    <footer class="footer">
      <p>Thought GPS v1.2.2 | AI Agent Platform | Mission Control | 2100 AD | <a href="#" onclick="showPage('legal'); return false;" style="color: #f08c29; text-decoration: none;">Legal & AI Disclaimer</a></p>
    </footer>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
