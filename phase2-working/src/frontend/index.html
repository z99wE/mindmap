<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought GPS // Mission Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Material 3 Dark Palette (No purple/blue, using clean warm Amber & Emerald accents) */
      --md-sys-color-background: #141210;
      --md-sys-color-on-background: #e7e1db;
      --md-sys-color-surface: #1d1b18;
      --md-sys-color-on-surface: #e7e1db;
      --md-sys-color-surface-variant: #2d2925;
      --md-sys-color-on-surface-variant: #cec5be;
      --md-sys-color-primary: #ffb800; /* Warm Amber */
      --md-sys-color-on-primary: #452b00;
      --md-sys-color-secondary: #00e676; /* Emerald */
      --md-sys-color-on-secondary: #003919;
      --md-sys-color-outline: #9c8e84;
      --md-sys-color-error: #ffb4ab;
      --md-sys-color-on-error: #690005;
      
      /* Elevations */
      --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
      --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.3);
      --md-elevation-3: 0px 4px 8px 3px rgba(0, 0, 0, 0.15), 0px 1px 3px 0px rgba(0, 0, 0, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--md-sys-color-background);
      color: var(--md-sys-color-on-background);
      min-height: 100vh;
      line-height: 1.5;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    
    /* Header - M3 Top App Bar */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: var(--md-sys-color-surface);
      border-radius: 16px;
      box-shadow: var(--md-elevation-2);
      margin-bottom: 2rem;
    }
    
    .header h1 {
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--md-sys-color-primary);
      letter-spacing: -0.02em;
    }
    
    .status-badge {
      padding: 0.5rem 1rem;
      background: var(--md-sys-color-surface-variant);
      border: 1px solid var(--md-sys-color-outline);
      color: var(--md-sys-color-on-surface-variant);
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: 'Roboto Mono', monospace;
    }
    
    /* Navigation - M3 Navigation Tabs */
    .nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }
    
    .nav-btn {
      padding: 0.75rem 1.25rem;
      background: transparent;
      border: none;
      color: var(--md-sys-color-on-surface-variant);
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    
    .nav-btn:hover {
      background: var(--md-sys-color-surface-variant);
    }
    
    .nav-btn.active {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: var(--md-elevation-1);
    }
    
    /* Content cards - M3 Elevated Cards */
    .card {
      background: var(--md-sys-color-surface);
      border-radius: 24px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--md-elevation-1);
    }
    
    .card h2 {
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--md-sys-color-primary);
      margin-bottom: 1.5rem;
    }
    
    /* Buttons - M3 Filled & Outlined Buttons */
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 100px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-primary {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: var(--md-elevation-1);
    }
    
    .btn-primary:hover {
      box-shadow: var(--md-elevation-2);
      transform: translateY(-1px);
    }
    
    .btn-secondary {
      background: transparent;
      border-color: var(--md-sys-color-outline);
      color: var(--md-sys-color-primary);
    }
    
    .btn-secondary:hover {
      background: rgba(255, 184, 0, 0.08);
    }
    
    .btn-accent {
      background: var(--md-sys-color-secondary);
      color: var(--md-sys-color-on-secondary);
    }
    
    .btn-success {
      background: var(--md-sys-color-secondary);
      color: var(--md-sys-color-on-secondary);
    }
    
    /* Form inputs - M3 Outlined Text Field */
    input, select {
      padding: 1rem;
      background: transparent;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 12px;
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      width: 100%;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s ease;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: var(--md-sys-color-primary);
      border-width: 2px;
    }
    
    /* Stats grid - M3 Grid Layout */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .stat-box {
      background: var(--md-sys-color-surface-variant);
      padding: 1.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: var(--md-elevation-1);
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
    }
    
    .stat-label {
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }
    
    /* Keys Table - M3 Tables */
    .keys-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }
    
    .keys-table th, .keys-table td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
    }
    
    .keys-table th {
      color: var(--md-sys-color-primary);
      font-weight: 500;
      font-size: 0.9rem;
    }
    
    .keys-table td {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.95rem;
    }
    
    /* Warning banner - M3 Banner */
    .warning {
      background: rgba(255, 180, 171, 0.15);
      border: 1px solid var(--md-sys-color-error);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      color: var(--md-sys-color-error);
      margin-bottom: 1.5rem;
    }

    /* M3 Landing Pitch Styling */
    .home-pitch-container {
      display: flex;
      flex-direction: column;
      gap: 4rem;
    }
    
    .hero-section {
      text-align: center;
      padding: 5rem 1.5rem;
      background: var(--md-sys-color-surface);
      border-radius: 28px;
      box-shadow: var(--md-elevation-1);
    }
    
    .brand-eyebrow {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--md-sys-color-secondary);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }
    
    .hero-headline {
      font-size: 3rem;
      font-weight: 400;
      line-height: 1.15;
      color: var(--md-sys-color-primary);
      margin-bottom: 1.5rem;
      letter-spacing: -0.03em;
    }
    
    .hero-subheadline {
      font-size: 1.2rem;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 60ch;
      margin: 0 auto 2.5rem auto;
      line-height: 1.6;
    }
    
    .hero-cta-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 3rem;
    }
    
    .telemetry-ticker {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Roboto Mono', monospace;
      color: var(--md-sys-color-secondary);
      background: var(--md-sys-color-surface-variant);
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
    }
    
    .telemetry-pulse {
      width: 8px;
      height: 8px;
      background: var(--md-sys-color-secondary);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }
    
    .value-prop-strip {
      background: var(--md-sys-color-surface-variant);
      padding: 1.25rem;
      border-radius: 16px;
      overflow: hidden;
    }
    
    .marquee-wrapper {
      white-space: nowrap;
      overflow: hidden;
    }
    
    .marquee-content {
      display: inline-block;
      animation: marquee 25s linear infinite;
      font-size: 0.95rem;
      color: var(--md-sys-color-on-surface);
    }
    
    .marquee-content span {
      margin-right: 2rem;
    }
    
    .marquee-content .divider {
      color: var(--md-sys-color-primary);
      font-weight: bold;
    }
    
    @keyframes marquee {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }
    
    .grid-2col {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 3rem;
    }
    
    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--md-sys-color-primary);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }
    
    .section-heading {
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 1.5rem;
    }
    
    .section-body {
      font-size: 1rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 2rem;
    }
    
    .problem-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    
    .problem-item {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    
    .cross-icon {
      width: 16px;
      height: 16px;
      border: 1px solid var(--md-sys-color-primary);
      border-radius: 4px;
      position: relative;
      flex-shrink: 0;
      margin-top: 4px;
    }
    
    .cross-icon::after {
      content: "!";
      position: absolute;
      top: -3px;
      left: 5px;
      color: var(--md-sys-color-primary);
      font-size: 0.75rem;
      font-weight: bold;
    }
    
    .solution-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    
    .solution-card {
      background: var(--md-sys-color-surface-variant);
      padding: 1.25rem;
      border-radius: 16px;
    }
    
    .sol-num {
      color: var(--md-sys-color-secondary);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    
    .pipeline-step {
      background: var(--md-sys-color-surface);
      border-left: 4px solid var(--md-sys-color-primary);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: var(--md-elevation-1);
    }
    
    .step-badge {
      color: var(--md-sys-color-primary);
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
    }
    
    .step-desc {
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .comparison-table-wrapper {
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 1.5rem;
    }
    
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
    }
    
    .comparison-table th, .comparison-table td {
      padding: 1rem 1.25rem;
      text-align: left;
    }
    
    .comparison-table th {
      background: var(--md-sys-color-surface-variant);
      font-weight: 500;
    }
    
    .comparison-table td {
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .accent-header {
      color: var(--md-sys-color-primary);
    }
    
    .success-row {
      color: var(--md-sys-color-on-surface);
      font-weight: bold;
    }
    
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    
    .benefit-item {
      background: var(--md-sys-color-surface-variant);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface);
    }
    
    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }
    
    .feat-card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-surface-variant);
      padding: 1.5rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .feat-card:hover {
      border-color: var(--md-sys-color-primary);
      transform: translateY(-2px);
      box-shadow: var(--md-elevation-2);
    }
    
    .feat-card h5 {
      color: var(--md-sys-color-primary);
      font-size: 1.1rem;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }
    
    .feat-card p {
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface-variant);
    }
    
    .brand-footer-pitch {
      text-align: center;
      padding: 4rem 1.5rem;
      background: var(--md-sys-color-surface);
      border-radius: 24px;
      margin-top: 2rem;
      box-shadow: var(--md-elevation-1);
    }
    
    .tagline {
      font-size: 2.2rem;
      font-weight: 400;
    }
    
    /* Footer */
    .footer {
      margin-top: 3rem;
      padding: 1.5rem;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  
  <div class="container">
    <header class="header">
      <h1>Thought GPS</h1>
      <div class="status-badge">MISSION CONTROL // V1.2.2 // 2100 AD</div>
    </header>
    
    <nav class="nav" role="navigation" aria-label="Main Menu">
      <button class="nav-btn active" onclick="showPage('home')" aria-label="Navigate to Home Page">HOME</button>
      <button class="nav-btn" onclick="showPage('dashboard')" aria-label="View System Dashboard">DASHBOARD</button>
      <button class="nav-btn" onclick="showPage('mission-control')" aria-label="Access Mission Control Details">MISSION CONTROL</button>
      <button class="nav-btn" onclick="showPage('brain-fragments')" aria-label="Analyze Brain Fragments and thinking lobes">BRAIN FRAGMENTS</button>
      <button class="nav-btn" onclick="showPage('cognitive-load')" aria-label="Inspect Seesaw Cognitive Load Level">COGNITIVE LOAD</button>
      <button class="nav-btn" onclick="showPage('api-keys')" aria-label="Configure third party API Keys">API KEYS</button>
      <button class="nav-btn" onclick="showPage('credits')" aria-label="Manage Account Tier Credits">CREDITS</button>
      <button class="nav-btn" onclick="showPage('memory')" aria-label="Open Memory Archive and Export Settings">MEMORY</button>
      <button class="nav-btn" onclick="showPage('legal')" aria-label="Read legal notice and AI hallucinations disclaimers">DISCLAIMERS</button>
    </nav>
    
    <main id="main-content"></main>
    
    <footer class="footer">
      <p>Thought GPS v1.2.2 | AI Agent Platform | Mission Control | 2100 AD | <a href="#" onclick="showPage('legal'); return false;" style="color: var(--md-sys-color-primary); text-decoration: none;">Legal & AI Disclaimer</a></p>
    </footer>
  </div>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
