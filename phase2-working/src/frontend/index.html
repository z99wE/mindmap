<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thought GPS — Cognitive Coprocessor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Barlow:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <style>.material-symbols-rounded { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; vertical-align: middle; }</style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Instrument Serif"', 'serif'],
            body: ['"Barlow"', 'sans-serif'],
          },
          borderRadius: {
            DEFAULT: '9999px',
          }
        }
      }
    }
  </script>

  <style>
    @import url('./src/styles/m3-tokens.css');
    @import url('./src/styles/glass.css');
    @import url('./src/styles/animations.css');
    @import url('./src/styles/tg-upgrade.css');

    /* ── Base ── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      /* Aurora backdrop — a whisper of color behind the glass, never a wash */
      background:
        radial-gradient(ellipse 120% 60% at 50% -10%, rgba(204, 255, 0, 0.035), transparent 55%),
        radial-gradient(ellipse 80% 50% at 92% 18%, rgba(106, 53, 255, 0.04), transparent 60%),
        radial-gradient(ellipse 90% 55% at 8% 85%, rgba(16, 185, 129, 0.03), transparent 55%),
        radial-gradient(ellipse 70% 45% at 85% 100%, rgba(148, 163, 184, 0.05), transparent 60%),
        var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      overflow-x: hidden;
      min-height: 100vh;
    }
    h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); }
    a { color: inherit; text-decoration: none; }
    button { font-family: var(--font-body); }

    /* ── Grid Pattern Background ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at 50% 20%, black 10%, transparent 90%);
    }

    /* ── Noise Overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
      opacity: 0.05;
    }

    #app-root { position: relative; z-index: 1; min-height: 100vh; }

    /* ── App Shell ── */
    .app-shell { display: grid; grid-template-columns: 248px 1fr; grid-template-rows: auto 1fr; min-height: 100vh; }
    @media (max-width: 840px) { .app-shell { grid-template-columns: 1fr; } }

    /* ── Navigation Dial (Desktop) — just the rotating menu, no chrome ── */
    .nav-rail {
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 1rem 0;
      background: transparent;
      z-index: 10;
    }
    @media (max-width: 840px) { .nav-rail { display: none; } }

    .nav-logo {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-logo-icon {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: linear-gradient(145deg, var(--brand-primary-bright), var(--brand-primary-dim));
      display: grid; place-items: center;
      box-shadow: 4px 4px 0 0 rgba(0, 0, 0, 0.4), 0 0 26px rgba(204, 255, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      font: italic 700 19px/1 var(--font-heading);
      color: #000000;
      letter-spacing: -0.02em;
      transition: transform 160ms var(--md-sys-motion-easing-spring), box-shadow 200ms ease;
    }
    .nav-logo:hover .nav-logo-icon { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 0 rgba(0, 0, 0, 0.4), 0 0 34px rgba(204, 255, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
    .nav-logo-text { font: 600 15px/1.2 var(--font-heading); color: var(--md-sys-color-on-surface); letter-spacing: -0.02em; }
    .nav-logo-sub { font: 500 10px/1.2 var(--font-mono); color: var(--brand-ink-faint); text-transform: uppercase; letter-spacing: 0.16em; margin-top: 3px; }

    .nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      border-radius: 0.9rem;
      font: 500 13px/20px var(--font-body);
      color: var(--brand-ink-dim);
      cursor: pointer;
      transition: all 200ms var(--md-sys-motion-easing-standard);
      position: relative;
      border: 1px solid transparent;
    }
    .nav-item:hover { background: rgba(255,255,255,.05); color: var(--md-sys-color-on-surface); border-color: rgba(255,255,255,0.06); }
    .nav-item.active {
      background: rgba(204, 255, 0, 0.1);
      border-color: rgba(204, 255, 0, 0.28);
      color: var(--color-analytical);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 0 22px -6px rgba(204, 255, 0, 0.35);
    }
    .nav-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      flex-shrink: 0;
      transition: all 200ms ease;
    }
    .nav-item.active .nav-dot { background: #ccff00; box-shadow: 0 0 10px rgba(204,255,0,0.6); }

    /* ── Bottom Nav (Mobile) — Liquid Glass navigation layer ── */
    .bottom-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(12, 13, 17, 0.8);
      backdrop-filter: blur(34px) saturate(190%);
      -webkit-backdrop-filter: blur(34px) saturate(190%);
      border-top: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 0 -18px 50px -20px rgba(0, 0, 0, 0.6);
      z-index: 100;
      padding: 0.5rem 0 env(safe-area-inset-bottom, 0.5rem);
    }
    .bottom-nav-items { display: flex; justify-content: space-around; }
    .bottom-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 0.5rem 0.75rem;
      color: var(--brand-ink-faint);
      font: 500 11px/1.2 var(--font-body);
      cursor: pointer;
      border-radius: 0.9rem;
      transition: all 200ms ease;
    }
    .bottom-nav-item.active { color: var(--color-analytical); background: rgba(204,255,0,0.08); }
    .bottom-nav-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.4;
    }
    .bottom-nav-item.active .bottom-nav-dot { opacity: 1; box-shadow: 0 0 6px rgba(204,255,0,0.5); }
    @media (max-width: 840px) { .bottom-nav { display: block; } main { padding-bottom: 84px; } }

    /* ── Top Bar — Glassmorphism: translucent frost over the page ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
        inset 0 -18px 28px -20px rgba(255, 255, 255, 0.06),
        inset 0 0 60px -30px rgba(204, 255, 0, 0.12),
        0 12px 32px -16px rgba(0, 0, 0, 0.55);
      position: sticky; top: 0; z-index: 5;
    }
    /* Colorful glow band fixed behind the bar so the frost has light to refract */
    .aurora-band {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 220px;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 120% at 50% -10%, rgba(204, 255, 0, 0.14), transparent 60%),
        radial-gradient(ellipse 38% 110% at 16% 0%, rgba(106, 53, 255, 0.14), transparent 55%),
        radial-gradient(ellipse 42% 115% at 86% 0%, rgba(16, 185, 129, 0.10), transparent 55%);
      filter: blur(12px);
    }
    /* Keep dim-gray controls legible over the lighter frost */
    .top-bar .icon-btn { color: rgba(228, 234, 244, 0.85); }
    .top-bar .icon-btn:hover { color: #ffffff; }
    .top-bar .status-tag { color: rgba(240, 245, 235, 0.75); }
    .top-bar .status-tag .dot-pulse { background: #d4ff33; }
    .top-bar-title { font: 600 17px/24px var(--font-heading); letter-spacing: -0.02em; }
    .top-bar-actions { display: flex; align-items: center; gap: 0.75rem; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07);
      color: var(--brand-ink-dim);
      cursor: pointer;
      position: relative;
      transition: all 150ms ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,.09); color: var(--md-sys-color-on-surface); border-color: rgba(255,255,255,0.14); }
    .badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px;
      border-radius: 50%;
      background: #ef4444;
      color: #fff;
      font: 600 10px/16px var(--font-heading);
      display: grid; place-items: center;
      padding: 0 4px;
    }
    .user-chip {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      cursor: pointer;
      transition: all 200ms;
    }
    .user-chip:hover { border-color: rgba(204, 255, 0, 0.45); background: rgba(204,255,0,0.05); }

    /* ── Main Content ── */
    main {
      padding: 1.5rem;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }
    @media (max-width: 840px) { main { padding: 1rem; } }

    /* ── Mobile Menu Button ── */
    .mobile-menu-btn { display: none; }
    @media (max-width: 840px) { .mobile-menu-btn { display: grid; } }

    /* ── Mobile Drawer ── */
    .mobile-drawer {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(6px);
      opacity: 0; pointer-events: none;
      transition: opacity 300ms ease;
    }
    .mobile-drawer.open { opacity: 1; pointer-events: auto; }
    .mobile-drawer-content {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 300px; max-width: 85vw;
      background: linear-gradient(180deg, rgba(16, 17, 21, 0.92), rgba(10, 11, 14, 0.96));
      backdrop-filter: blur(30px) saturate(190%);
      -webkit-backdrop-filter: blur(30px) saturate(190%);
      padding: 1rem;
      transform: translateX(-100%);
      transition: transform 300ms cubic-bezier(0.05, 0.7, 0.1, 1);
      overflow-y: auto;
      border-right: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.08), 24px 0 60px -24px rgba(0, 0, 0, 0.7);
    }
    .mobile-drawer.open .mobile-drawer-content { transform: translateX(0); }

    /* ── UI Legibility ── */
    p { color: var(--md-sys-color-on-surface-variant); }
    input, textarea, select, option { color: #ffffff; }

    /* ── Hide scrollbars globally for a cleaner UI ── */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; -ms-overflow-style: none; }

    /* ── Liquid Glass golden rule: solid fallback for nav layers ── */
    @media (prefers-reduced-transparency: reduce) {
      .top-bar, .bottom-nav, .mobile-drawer-content {
        background: var(--neopop-popblack-400);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        box-shadow: none;
      }
      .aurora-band { opacity: 0.12; }
    }
  </style>
</head>
<body>
  <!-- Skip to content (accessibility) -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Aurora band behind the top bar (gives the glass something to refract) -->
  <div class="aurora-band" aria-hidden="true"></div>

  <!-- Glow Spheres -->
  <div class="ambient-orb orb-primary"></div>
  <div class="ambient-orb orb-secondary"></div>
  <div class="ambient-orb orb-tertiary"></div>
  <div class="ambient-orb orb-violet" style="left: 40%; top: -8rem; width: 26rem; height: 26rem;"></div>
  <div class="ambient-orb orb-yoyo" style="right: -8rem; bottom: -6rem; width: 24rem; height: 24rem;"></div>

  <div id="app-root">
    <div class="app-shell">
      <!-- Desktop Nav Dial (rotating menu only) -->
      <nav class="nav-rail" id="nav-rail" role="navigation" aria-label="Main navigation"></nav>

      <!-- Main area -->
      <div style="display:flex;flex-direction:column;min-height:100vh;">
        <!-- Top Bar -->
        <header class="top-bar glass-rim" id="top-bar">
          <div style="display:flex;align-items:center;gap:0.75rem;">
            <button class="icon-btn mobile-menu-btn" onclick="toggleDrawer()" aria-label="Open menu">
              <span style="font:700 18px/1 'Space Grotesk';">&#9776;</span>
            </button>
            <div id="top-logo-root" style="width:140px; height:36px; margin-right:auto;"></div>
            <span class="top-bar-title" id="page-title" style="display:none;">Home</span>
          </div>
          <div class="top-bar-actions">
            <div class="status-tag" style="margin-right:0.5rem;">
              <span class="dot-pulse"></span>
              <span>SYSTEM ONLINE</span>
            </div>
            <button class="tg-topchip" id="notif-btn" onclick="showPage('notifications')" aria-label="Notifications">
              <span class="tg-topchip-label">Notifications</span>
              <span class="badge" id="notif-badge" style="display:none;">0</span>
            </button>
            <div class="user-chip" id="user-chip" onclick="handleUserClick()" role="button" aria-label="User account">
              <span id="user-name" style="font:500 13px/1 'Space Grotesk',sans-serif;">Sign In</span>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" aria-live="polite"></main>
        <!-- Ambient Footer -->
        <div id="app-footer" style="height: 180px; position: relative; width: 100%; overflow: hidden; margin-top: auto; z-index: 0;">
          <div id="footer-react-root" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;"></div>
        </div>
      </div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="bottom-nav glass-rim" role="navigation" aria-label="Mobile navigation">
      <div class="bottom-nav-items" id="bottom-nav-items"></div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" id="mobile-drawer" onclick="closeDrawer(event)">
      <div class="mobile-drawer-content" id="drawer-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
  <script>
    // ── Service Worker Registration ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('/sw.js');
          console.log('[SW] Registered:', reg.scope);
          // Fetch VAPID public key and subscribe
          const res = await fetch('/api/notifications/vapid-public-key');
          if (res.ok) {
            const { publicKey } = await res.json();
            const sub = await reg.pushManager.getSubscription();
            if (!sub) {
              await reg.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: publicKey,
              });
            }
          }
        } catch (e) { console.warn('[SW] Registration failed:', e); }
      });
    }
    function toggleDrawer() {
      document.getElementById('mobile-drawer').classList.toggle('open');
    }
    function closeDrawer(e) {
      if (e.target === e.currentTarget) {
        document.getElementById('mobile-drawer').classList.remove('open');
      }
    }
    window.toggleDrawer = toggleDrawer;
    window.closeDrawer = closeDrawer;

    // ── Scroll Reveal + Parallax Observer ──
    (function() {
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            setTimeout(() => entry.target.classList.add('in-view'), i * 80);
            revealObserver.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

      const mainObserver = new MutationObserver(() => {
        document.querySelectorAll('.scroll-reveal:not(.in-view)').forEach(el => {
          revealObserver.observe(el);
        });
        // Also observe card-reveal elements
        document.querySelectorAll('.card-reveal:not(.revealed)').forEach((el, i) => {
          setTimeout(() => el.classList.add('revealed'), i * 60);
        });
      });
      mainObserver.observe(document.getElementById('main-content') || document.body, {
        childList: true, subtree: true
      });

      // ── Parallax depth on scroll ──
      window.addEventListener('scroll', () => {
        const scrollY = window.scrollY;
        document.querySelectorAll('.parallax-section').forEach((section, i) => {
          const speed = 0.15 + (i * 0.05);
          section.style.transform = `translateY(${scrollY * speed}px)`;
        });
      }, { passive: true });
    })();
  </script>
</body>
</html>
