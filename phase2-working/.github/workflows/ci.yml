# Pre-merge CI — fast feedback for every pull request
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: phase2-working/package-lock.json
      - run: npm ci
        working-directory: phase2-working
      - run: npm run lint
        working-directory: phase2-working
      - run: npx prettier --check .
        working-directory: phase2-working
        continue-on-error: true  # Format is advisory at this stage

  test:
    name: Full Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: phase2-working/package-lock.json
      - run: npm ci
        working-directory: phase2-working
      - run: npm run test:all
        working-directory: phase2-working
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          API_KEY_ENCRYPTION_SECRET: ci-test-encryption-secret
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: phase2-working/coverage/
          retention-days: 7

  security:
    name: Security Scan
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: phase2-working/package-lock.json
      - run: npm ci
        working-directory: phase2-working
      - name: npm audit
        run: npm audit --audit-level=high
        working-directory: phase2-working
        continue-on-error: true

  frontend:
    name: Frontend Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: phase2-working/src/frontend
      - run: npm run build
        working-directory: phase2-working/src/frontend
