version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rementally-db
    environment:
      POSTGRES_DB: rementally
      POSTGRES_USER: rementally_user
      POSTGRES_PASSWORD: rementally_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rementally_user -d rementally"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./phase2-working
      dockerfile: Dockerfile
    container_name: rementally-app
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://rementally_user:rementally_pass@postgres:5432/rementally
      JWT_SECRET: dev-jwt-secret-change-in-production
      API_KEY_ENCRYPTION_SECRET: dev-encryption-secret-32chars!!
      FRONTEND_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./phase2-working/src:/app/src
      - ./phase2-working/features:/app/features
    command: node server.js

volumes:
  pgdata:
